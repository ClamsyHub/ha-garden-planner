name: Publish development release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Approved development tag, e.g. v0.1.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: garden-planner-release
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  tests:
    uses: ./.github/workflows/tests.yml
  package:
    needs: [validation, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Validate and build approved candidate
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python scripts/check_repository.py --release --tag "$CANDIDATE_TAG"
          python -m scripts.build_release --tag "$CANDIDATE_TAG" --output "$RUNNER_TEMP/release/garden_planner.zip"
          cd "$RUNNER_TEMP/release"
          sha256sum garden_planner.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          retention-days: 14
  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
      - name: Publish only the tested commit as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          python -m scripts.publish_release --tag "$CANDIDATE_TAG" --commit "$GITHUB_SHA" --assets "$RUNNER_TEMP/release"
