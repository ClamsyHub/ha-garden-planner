[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-garden-planner"
version = "0.1.4"
description = "Local sowing, planting and harvest planning for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Garden Planner contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.4", "mypy==1.18.2"]
ha-test = ["homeassistant==2026.7.0"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.14"
strict = true
files = ["custom_components/garden_planner", "scripts", "tests", "ha_tests"]

[tool.setuptools.packages.find]
include = ["custom_components.garden_planner*"]
